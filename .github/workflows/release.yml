name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签，例如 v1.0.1（标签须已存在）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 校验标签与程序集版本一致
        shell: pwsh
        run: |
          $version = ([xml][IO.File]::ReadAllText((Resolve-Path PAM.App/PAM.App.csproj))).SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          $tag = '${{ inputs.tag || github.ref_name }}'
          if ($tag -ne "v$version") {
            throw "标签 $tag 与 PAM.App.csproj 的 Version $version 不一致。先修改两个 csproj 的 <Version> 再打标签。"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 运行单元测试
        shell: pwsh
        run: dotnet test --configuration Release --nologo -v minimal

      - name: 准备 Inno Setup 编译器
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw '未找到 ISCC.exe' }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 构建安装程序
        shell: pwsh
        run: .\build\build-installer.ps1

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: PowerShell 管理器 v${{ env.VERSION }}
          files: |
            output/export/PAM-Setup-*.exe
          generate_release_notes: true
          body: |
            ## 安装

            下载 `PAM-Setup-*.exe` 双击安装；不需要管理员权限，也不需要预先安装 .NET 运行时。

            ## 卸载

            从「设置 → 应用 → 已安装的应用」或开始菜单的「卸载 PowerShell 管理器」卸载。
            卸载会移除两份 `$PROFILE` 里的 PAM 托管区，并自动为原文件生成备份。
